version: "2"

run:
  timeout: 5m

linters:
  enable:
    - gosec
    - revive
    - misspell
    - gocritic
    - unconvert
    - unparam
    - bodyclose
  exclusions:
    rules:
      # Recipe implementations: the interface documents Name/Title/Detect once, and each
      # recipe type carries its own doc line. Per-method godoc would only repeat them.
      - path: core/recipes/
        linters:
          - revive
        text: "exported method"
      # The Spanish catalogue is not English prose: misspell only knows English, and gosec's
      # credential heuristic misreads a large map of message literals as a secret.
      - path: core/i18n/
        linters:
          - misspell
      - path: core/i18n/
        linters:
          - gosec
        text: "G101"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/neomikhe/git-rewind
