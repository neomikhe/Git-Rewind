name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Everything that runs project or third-party code happens here, without write access.
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Tag points at a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Modules are tidy
        run: go mod tidy -diff

      - name: Test
        run: go test ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          for goos in linux darwin windows; do
            echo "govulncheck GOOS=$goos"
            GOOS="$goos" "$(go env GOPATH)/bin/govulncheck" ./...
          done

  # The only job holding a write token: it builds and publishes, and runs nothing else.
  goreleaser:
    name: goreleaser
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # GoReleaser needs the full history and all tags to build the changelog.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # No build cache on the release path, so nothing another run cached can reach a published binary.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      # dist/ is created before the build; untracked, it would stamp every binary vcs.modified=true.
      - name: Keep the build output out of git status
        run: echo "/dist/" >> .git/info/exclude

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Signed by GitHub's OIDC identity, so a download can be traced to this workflow and commit.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
